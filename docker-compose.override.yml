# Override local de desenvolvimento. Não altera o compose versionado.
# A imagem `devlikeapro/waha:noweb` compara a API key em literal se o valor
# não tiver o prefixo `sha512:`. Sem o prefixo, o app (que envia o plaintext
# em X-Api-Key) toma 401 — medido nesta máquina. O compose de produção já
# usa este prefixo; aqui só alinhamos o ambiente local.
#
# Redis + serverless-redis-http: o mesmo par do docker-compose.prod.yml,
# com a porta 8079 publicada porque o Next roda no host (não na rede do compose).
services:
  waha:
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"

  redis:
    image: redis:7-alpine
    container_name: deskcomm-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    container_name: deskcomm-srh
    restart: unless-stopped
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
