# CRM — Apache SOMENTE :443. Porta 80 é do Tomcat.
# Certificado: certbot certonly --webroot -w /opt/tomcat7/webapps/ROOT -d crm.facejus.com.br
# Use scripts/script-cert-crm.sh

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName crm.facejus.com.br
    ServerAdmin admin@facejus.com.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/crm.facejus.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/crm.facejus.com.br/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/crm-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/crm-ssl-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300

    ProxyPass        / http://127.0.0.1:3666/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:3666/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>
</IfModule>
