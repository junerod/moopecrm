# CRM Deskcomm — NÃO use o script do Facejus (aquele manda /api para :5178).
# Tudo neste host vai para o Next na 3666.
#
#   cp scripts/apache-crm.facejus.com.br.conf /etc/apache2/sites-available/crm.facejus.com.br.conf
#   a2enmod proxy proxy_http headers rewrite ssl
#   a2ensite crm.facejus.com.br.conf
#   apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d crm.facejus.com.br -m admin@facejus.com.br --agree-tos --redirect --non-interactive

<VirtualHost *:80>
    ServerName crm.facejus.com.br
    ServerAdmin admin@facejus.com.br

    ErrorLog ${APACHE_LOG_DIR}/crm-error.log
    CustomLog ${APACHE_LOG_DIR}/crm-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300

    ProxyPass        / http://127.0.0.1:3666/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:3666/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
</VirtualHost>
